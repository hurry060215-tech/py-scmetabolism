[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-scmetabolism"
version = "0.1.0"
description = "Python reimplementation of scMetabolism for single-cell metabolism analysis"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Zac-lzh", email = "18960339395@163.com" },
]
keywords = [
    "single-cell", "scRNA-seq", "metabolism", "pathway", "enrichment",
    "scanpy", "anndata",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "anndata>=0.8",
    "matplotlib>=3.5",
    "seaborn>=0.11",
    "scikit-learn>=1.0",
    "tqdm>=4.62",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
full = ["scanpy", "decoupler", "gseapy"]

[project.urls]
Homepage = "https://github.com/Zac-lzh/py-scmetabolism"

[tool.setuptools.packages.find]
include = ["py_scmetabolism*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]